server.port=8080

# --- ACTUATOR CONFIG ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# --- RABBITMQ CONFIG ---
# Likes
rabbitmq.queue.api-likes=api.like.created.queue
rabbitmq.exchange.likes=likes.exchange
rabbitmq.routing.key.like-created=like.created.key

# Comments
rabbitmq.queue.api-comments=agora.api.comments.queue
rabbitmq.exchange.comments=comments.exchange
rabbitmq.routing.key.comment-wildcard=comment.#

# STOMP relay (WebSocket)
rabbitmq.stomp.host=rabbitmq

spring.rabbitmq.template.observation-enabled=true

# --- DATABASE ---
spring.datasource.url=jdbc:postgresql://db:5432/my_twitter_db

spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.minimum-idle=10

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.validate-migration-naming=true
spring.flyway.validate-on-migrate=true
spring.flyway.enabled=true

# --- JWT token lifetime (secret is in application.properties) ---
access.life.time=300000
refresh.life.time=432000000

# --- Minio ---
minio.url=http://minio:9000
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=agora-images

server.forward-headers-strategy=framework

# --- Route to swagger documentation ---
springdoc.api-docs.path=/api/v3/api-docs

# --- Kafka (producer) ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# В заголовок __TypeId__ пишется короткий алиас вместо полного имени класса;
# консьюмеры сопоставляют алиас со своими классами (пакеты у сервисов разные)
spring.kafka.producer.properties.spring.json.type.mapping=postCreated:agora.dto.event.PostCreatedEvent
