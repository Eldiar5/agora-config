server.port=8080
spring.cloud.openfeign.circuitbreaker.enabled=true

# --- RABBITMQ CONFIG ---
spring.rabbitmq.listener.simple.observation-enabled=true

# QUEUES
rabbitmq.queue.like-created=stats.like.created.queue
rabbitmq.queue.like-deleted=stats.like.deleted.queue

# --- Kafka (consumer) ---
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
# Алиас из заголовка __TypeId__ -> локальный класс (должен совпадать с алиасом продюсера в agora-api)
spring.kafka.consumer.properties.spring.json.type.mapping=postCreated:org.agora.statistic.dto.event.PostCreatedEvent, \
  likeCreated:org.agora.statistic.dto.event.LikeCreatedEvent,likeDeleted:org.agora.statistic.dto.event.LikeDeletedEvent
