# ==========================================================
#  Shared overrides for ALL services when running locally
#  (profile "local": infrastructure in Docker, services in IDE).
# ==========================================================

# --- Eureka ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=http://localhost:${server.port}

# --- RabbitMQ ---
spring.rabbitmq.host=localhost
rabbitmq.stomp.port=62613

# --- Dev defaults for secrets (local Docker infra only, NOT real secrets) ---
# Env vars still win if set: ${VAR:default}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1}
jwt.secret.key=${JWT_SECRET:NhR8FwGe+WRWxtDI6mbA2fb2plC6WtXwTYR9FGjNmDdNIjQJ1MmVHXDOs8pQZC/Z}

# --- Distributed Tracing ---
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
