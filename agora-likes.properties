server.port=8082

# --- DATABASE ---
spring.datasource.url=jdbc:postgresql://db:5432/likes_db

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# --- RABBITMQ CONFIG ---
spring.rabbitmq.template.observation-enabled=true

# --- Route to swagger documentation ---
springdoc.api-docs.path=/api/v3/api-docs

# --- Kafka (producer) ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=likeCreated:org.example.agoralikes.dto.event.LikeCreatedEvent,\
  likeDeleted:org.example.agoralikes.dto.event.LikeDeletedEvent