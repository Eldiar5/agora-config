# ==========================================
#  Local routes: the FULL list must stay here.
#  Spring Boot replaces indexed lists as a whole
#  (no per-index merge with gateway-api.properties).
# ==========================================

# --- Eureka (Dashboard) ---
# [2] CSS
spring.cloud.gateway.routes[0].id=eureka-static-css
spring.cloud.gateway.routes[0].order=1
spring.cloud.gateway.routes[0].uri=http://localhost:8761
spring.cloud.gateway.routes[0].predicates[0]=Path=/eureka/css/**

# [3] JS
spring.cloud.gateway.routes[1].id=eureka-static-js
spring.cloud.gateway.routes[1].order=1
spring.cloud.gateway.routes[1].uri=http://localhost:8761
spring.cloud.gateway.routes[1].predicates[0]=Path=/eureka/js/**

# [4] Images
spring.cloud.gateway.routes[2].id=eureka-static-images
spring.cloud.gateway.routes[2].order=1
spring.cloud.gateway.routes[2].uri=http://localhost:8761
spring.cloud.gateway.routes[2].predicates[0]=Path=/eureka/images/**

# [5] Fonts
spring.cloud.gateway.routes[3].id=eureka-static-fonts
spring.cloud.gateway.routes[3].order=1
spring.cloud.gateway.routes[3].uri=http://localhost:8761
spring.cloud.gateway.routes[3].predicates[0]=Path=/eureka/fonts/**

# [6] Eureka
spring.cloud.gateway.routes[4].id=eureka-dashboard-route
spring.cloud.gateway.routes[4].order=10
spring.cloud.gateway.routes[4].uri=http://localhost:8761
spring.cloud.gateway.routes[4].predicates[0]=Path=/eureka/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1

# ==========================================
# --- (Short Link) ---
# /api/help -> /swagger-ui.html
# ==========================================

spring.cloud.gateway.routes[5].id=swagger-short-link
spring.cloud.gateway.routes[5].order=-100
spring.cloud.gateway.routes[5].uri=no://op
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/help
spring.cloud.gateway.routes[5].filters[0]=RedirectTo=302, /swagger-ui.html

# [6] Agora Stats
spring.cloud.gateway.routes[6].id=agora-stats-route
spring.cloud.gateway.routes[6].uri=lb://AGORA-STATS
spring.cloud.gateway.routes[6].predicates[0]=Path=/stats/**
spring.cloud.gateway.routes[6].filters[0]=Authentication

# [7-8] Agora likes
spring.cloud.gateway.routes[7].id=agora-likes-route
spring.cloud.gateway.routes[7].uri=lb://AGORA-LIKES
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/likes/**
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/api/v1/(?<segment>.*), /api/v1/$\{segment}
spring.cloud.gateway.routes[7].filters[1]=Authentication

spring.cloud.gateway.routes[8].id=agora-likes-docs
spring.cloud.gateway.routes[8].uri=lb://AGORA-LIKES
spring.cloud.gateway.routes[8].predicates[0]=Path=/v3/api-docs/agora-likes
spring.cloud.gateway.routes[8].filters[0]=RewritePath=/v3/api-docs/agora-likes, /api/v3/api-docs

# [9-10] Agora Comments
spring.cloud.gateway.routes[9].id=agora-comments-route
spring.cloud.gateway.routes[9].uri=lb://AGORA-COMMENTS
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/v1/comments/**
spring.cloud.gateway.routes[9].filters[0]=RewritePath=/api/v1/(?<segment>.*), /api/v1/$\{segment}
spring.cloud.gateway.routes[9].filters[1]=Authentication

spring.cloud.gateway.routes[10].id=agora-comments-docs
spring.cloud.gateway.routes[10].uri=lb://AGORA-COMMENTS
spring.cloud.gateway.routes[10].predicates[0]=Path=/v3/api-docs/agora-comments
spring.cloud.gateway.routes[10].filters[0]=RewritePath=/v3/api-docs/agora-comments, /api/v3/api-docs

# [11-12] Agora API
spring.cloud.gateway.routes[11].id=agora-api-route
spring.cloud.gateway.routes[11].uri=lb://AGORA-API
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/v1/**
spring.cloud.gateway.routes[11].filters[0]=RewritePath=/api/v1/(?<segment>.*), /api/v1/$\{segment}

spring.cloud.gateway.routes[12].id=agora-api-docs
spring.cloud.gateway.routes[12].uri=lb://AGORA-API
spring.cloud.gateway.routes[12].predicates[0]=Path=/v3/api-docs/agora-api
spring.cloud.gateway.routes[12].filters[0]=RewritePath=/v3/api-docs/agora-api, /api/v3/api-docs

# [13] WebSocket Route (Real-time notifications)
spring.cloud.gateway.routes[13].id=websocket-route
spring.cloud.gateway.routes[13].uri=lb://AGORA-API
spring.cloud.gateway.routes[13].predicates[0]=Path=/ws/**
spring.cloud.gateway.routes[13].filters[0]=RewritePath=/ws/(?<segment>.*), /ws/$\{segment}
spring.cloud.gateway.routes[13].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
