server.port=8083

# --- DATABASE ---
spring.datasource.url=jdbc:postgresql://db:5432/comments_db

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# --- RABBITMQ PRODUCER CONFIG ---
# Exchange for comment events
rabbitmq.exchange.comments=comments.exchange

# Routing keys
rabbitmq.routing.key.comment-created=comment.created.key
rabbitmq.routing.key.comment-deleted=comment.deleted.key

# --- Route to swagger documentation ---
springdoc.api-docs.path=/api/v3/api-docs
