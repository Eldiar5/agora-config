# ==========================================================
#  Shared configuration for ALL services (Docker profile).
#  Service files ({app}.properties) override these values.
#  Priority (high -> low):
#    {app}-{profile} > application-{profile} > {app} > application
#
#  Secrets are NOT stored here: ${VAR} placeholders are resolved
#  by each service from its environment (see agora-infra/.env.example).
# ==========================================================

# --- Eureka ---
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# --- Actuator ---
management.endpoints.web.exposure.include=health
management.health.readiness-state.enabled=true
management.health.liveness-state.enabled=true

# --- RabbitMQ ---
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
rabbitmq.stomp.port=61613

# --- Database (URL is defined per service) ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# --- JWT (must be identical in gateway-api and agora-api) ---
jwt.secret.key=${JWT_SECRET}

# --- Distributed Tracing ---
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
